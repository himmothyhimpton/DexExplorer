name: Workflow Alerts

on:
  workflow_run:
    workflows: ["CI", "Android Build"]
    types:
      - completed

permissions:
  contents: read
  issues: write
  actions: read

jobs:
  alert-on-failure:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - name: Create alert issue
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const title = `❌ Workflow failed: ${run.name} (#${run.run_number})`;
            const body = `A workflow has failed.\n\n` +
              `• Name: ${run.name}\n` +
              `• Event: ${run.event}\n` +
              `• Branch: ${run.head_branch}\n` +
              `• Commit: ${run.head_commit?.id || ''}\n` +
              `• Actor: ${run.actor?.login}\n` +
              `• Run URL: ${run.html_url}\n` +
              `\nPlease investigate the logs and address the failure.`;
            const existing = await github.rest.search.issuesAndPullRequests({
              q: `repo:${context.repo.owner}/${context.repo.repo} in:title ${title}`
            });
            if (existing.data.total_count > 0) {
              console.log('Alert issue already exists.');
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['ci-failure', 'needs-attention']
            });

