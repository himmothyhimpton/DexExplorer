name: Android Build

on:
  push:
    branches: [ main, app2-sync ]
  pull_request:
    branches: [ main, app2-sync ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          
      - name: Install Python dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
          
      - name: Install frontend dependencies
        run: |
          cd frontend
          npm install

      - name: Run frontend tests
        env:
          CI: true
        run: |
          cd frontend
          npm test -- --watchAll=false --passWithNoTests
          
      - name: Build frontend
        run: |
          cd frontend
          npm run build
          
      - name: Set up Capacitor
        run: |
          cd frontend
          npm install @capacitor/core@^6 @capacitor/cli@^6 @capacitor/android@^6
          if [ ! -f capacitor.config.json ]; then npx cap init "Dex Audit" "com.dexaudit.app" --web-dir=build; fi
          npx cap add android

      - name: Install AdMob plugin and sync
        run: |
          cd frontend
          npm install @capacitor-community/admob
          npx cap sync android

      - name: Add AdMob App ID to AndroidManifest
        run: |
          ADMOB_APP_ID="${{ secrets.ADMOB_APP_ID }}"
          if [ -z "$ADMOB_APP_ID" ]; then ADMOB_APP_ID="ca-app-pub-3940256099942544~3347511713"; fi
          MANIFEST="frontend/android/app/src/main/AndroidManifest.xml"
          if ! grep -q "com.google.android.gms.ads.APPLICATION_ID" "$MANIFEST"; then
            sed -i '/<application/a \\    <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="'"$ADMOB_APP_ID"'" \/>' "$MANIFEST"
          else
            sed -i 's|android:name=\"com.google.android.gms.ads.APPLICATION_ID\" android:value=\"[^\"]*\"|android:name=\"com.google.android.gms.ads.APPLICATION_ID\" android:value=\"'"$ADMOB_APP_ID"'\"|g' "$MANIFEST"
          fi
          
      - name: Copy backend to Android assets
        run: |
          mkdir -p frontend/android/app/src/main/assets/backend
          cp -r backend/* frontend/android/app/src/main/assets/backend/
          
      - name: Update Android configuration
        run: |
          cd frontend
          npx cap sync android

      - name: Align AGP/Kotlin across modules
        shell: bash
        run: |
          set -e
          # Capacitor core module
          if [ -f "frontend/node_modules/@capacitor/android/capacitor/build.gradle" ]; then
            sed -i "s/com.android.tools.build:gradle:8.2.1/com.android.tools.build:gradle:8.7.0/" frontend/node_modules/@capacitor/android/capacitor/build.gradle || true
            sed -i "s/ext.kotlin_version = .*'1.9.10'/ext.kotlin_version = project.hasProperty(\"kotlin_version\") ? rootProject.ext.kotlin_version : '1.9.24'/" frontend/node_modules/@capacitor/android/capacitor/build.gradle || true
          fi
          # Capacitor community admob plugin module
          if [ -f "frontend/node_modules/@capacitor-community/admob/android/build.gradle" ]; then
            sed -i "s/com.android.tools.build:gradle:8.2.1/com.android.tools.build:gradle:8.7.0/" frontend/node_modules/@capacitor-community/admob/android/build.gradle || true
            sed -i "s/ext.kotlin_version = .*'1.9.10'/ext.kotlin_version = project.hasProperty(\"kotlin_version\") ? rootProject.ext.kotlin_version : '1.9.24'/" frontend/node_modules/@capacitor-community/admob/android/build.gradle || true
          fi
          # Cordova android plugins bridge inside android project
          if [ -f "frontend/android/capacitor-cordova-android-plugins/build.gradle" ]; then
            sed -i "s/com.android.tools.build:gradle:8.2.1/com.android.tools.build:gradle:8.7.0/" frontend/android/capacitor-cordova-android-plugins/build.gradle || true
          fi

      - name: Force Android SDK versions to 34
        run: |
          FILE="frontend/android/variables.gradle"
          if [ -f "$FILE" ]; then
            sed -i 's/compileSdkVersion = [0-9]\+/compileSdkVersion = 34/' "$FILE"
            sed -i 's/targetSdkVersion = [0-9]\+/targetSdkVersion = 34/' "$FILE"
          else
            FILE="frontend/android/app/build.gradle"
            sed -i 's/compileSdkVersion [0-9]\+/compileSdkVersion 34/' "$FILE" || true
            sed -i 's/targetSdkVersion [0-9]\+/targetSdkVersion 34/' "$FILE" || true
          fi

      - name: Set versionCode and versionName for release
        run: |
          APP_GRADLE="frontend/android/app/build.gradle"
          VERSION_CODE=$((100000 + $GITHUB_RUN_NUMBER))
          VERSION_NAME="1.0.$GITHUB_RUN_NUMBER"
          sed -i "s/versionCode [0-9]\+/versionCode ${VERSION_CODE}/" "$APP_GRADLE"
          sed -i 's/versionName "[^"]\+"/versionName "'"${VERSION_NAME}"'"/' "$APP_GRADLE"

      - name: Prepare signing keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_ALIAS_PASSWORD: ${{ secrets.ANDROID_KEY_ALIAS_PASSWORD }}
        run: |
          set -e
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "No ANDROID_KEYSTORE_BASE64 secret provided; skipping signing setup."
            exit 0
          fi
          mkdir -p frontend/android
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > frontend/android/upload-keystore.jks
          echo "ANDROID_KEYSTORE_PATH=frontend/android/upload-keystore.jks" >> $GITHUB_ENV
          echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> $GITHUB_ENV
          echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> $GITHUB_ENV
          echo "ANDROID_KEY_ALIAS_PASSWORD=$ANDROID_KEY_ALIAS_PASSWORD" >> $GITHUB_ENV
          
      - name: Build Android APK
        run: |
          cd frontend/android
          ./gradlew assembleDebug
          
      - name: Build signed release AAB and APK (if signing provided)
        run: |
          cd frontend/android
          ./gradlew bundleRelease assembleRelease
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-signed-aab
          path: frontend/android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-signed
          path: frontend/android/app/build/outputs/apk/release/app-release.apk

      - name: Publish release with APK & AAB
        uses: softprops/action-gh-release@v1
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: build-${{ github.run_id }}
          name: Android Build ${{ github.run_number }}
          draft: false
          prerelease: true
          files: |
            frontend/android/app/build/outputs/apk/debug/app-debug.apk
            frontend/android/app/build/outputs/bundle/release/app-release.aab
            frontend/android/app/build/outputs/apk/release/app-release.apk

      - name: Upload to Google Play (internal track)
        if: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
        uses: r0adkll/upload-google-play@v3
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.dexaudit.app
          releaseFiles: frontend/android/app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
