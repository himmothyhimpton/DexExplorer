name: Branch Audit

on:
  schedule:
    - cron: '30 4 * * 1' # weekly Monday 04:30 UTC
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate branch cleanup report
        uses: actions/github-script@v7
        env:
          STALE_BRANCH_THRESHOLD_DAYS: '90'
        with:
          script: |
            const { owner, repo } = context.repo;
            const threshold = Number(process.env.STALE_BRANCH_THRESHOLD_DAYS || 90);
            const repoInfo = await github.rest.repos.get({ owner, repo });
            const defaultBranch = repoInfo.data.default_branch;
            const branches = await github.rest.repos.listBranches({ owner, repo, per_page: 100 });
            const stale = [];
            for (const b of branches.data) {
              if (b.name === defaultBranch) continue;
              const commits = await github.rest.repos.listCommits({ owner, repo, sha: b.name, per_page: 1 });
              const last = commits.data[0];
              const dateStr = last ? (last.commit.author?.date || last.commit.committer?.date) : undefined;
              const ageDays = dateStr ? Math.floor((Date.now() - new Date(dateStr).getTime()) / (24*60*60*1000)) : null;
              const protectedBranch = !!b.protected;
              if (ageDays !== null && ageDays >= threshold) {
                stale.push({ name: b.name, ageDays, protectedBranch, sha: last?.sha });
              }
            }
            const title = 'Branch cleanup report';
            const lines = [];
            lines.push(`# Branch cleanup report`);
            lines.push(`Threshold: ${threshold} days`);
            lines.push('');
            if (stale.length === 0) {
              lines.push('No stale branches found.');
            } else {
              lines.push('| Branch | Age (days) | Protected | Last Commit |');
              lines.push('|---|---:|:---:|---|');
              for (const s of stale.sort((a,b)=>b.ageDays-a.ageDays)) {
                const link = s.sha ? `https://github.com/${owner}/${repo}/commit/${s.sha}` : '';
                lines.push(`| ${s.name} | ${s.ageDays} | ${s.protectedBranch ? 'yes' : 'no'} | ${link} |`);
              }
            }
            const body = lines.join('\n');
            const issues = await github.rest.issues.listForRepo({ owner, repo, state: 'open', per_page: 100 });
            const existing = issues.data.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.update({ owner, repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ owner, repo, title, body, labels: ['maintenance'] });
            }

